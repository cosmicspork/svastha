[package]
name = "svastha-retrieval"
version = "0.16.0" # x-release-please-version
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Svastha retrieval: lexical ranking, context rendering, and citation grounding for cited Q&A over a vault."
readme = "README.md"
keywords = ["retrieval", "rag", "citations", "health", "svastha"]
categories = ["text-processing"]

[dependencies]
svastha-core = { path = "../core", version = "0.16.0" } # x-release-please-version
serde = { version = "1", features = ["derive"] }
# Event-kind wire names (the same serde source the event schema uses) and the
# tolerant parse of a model's JSON answer.
serde_json = "1"
