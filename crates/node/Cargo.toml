[package]
name = "svastha-node"
version = "0.13.0" # x-release-please-version
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Svastha node: a trusted processing client that delegates inference to an OpenAI-compatible endpoint."
readme = "README.md"
keywords = ["health", "encryption", "inference", "rag", "svastha"]
categories = ["cryptography"]

[dependencies]
svastha-core = { path = "../core", version = "0.13.0" } # x-release-please-version
# The OCR extractor is a third mapper alongside import's C-CDA/FHIR mappers: it
# reuses import's `EventDraft` and the canonical terminology URIs (`systems`)
# rather than inventing a parallel coding vocabulary.
svastha-import = { path = "../import", version = "0.13.0" } # x-release-please-version
# Ranking, context rendering, and citation grounding — shared with the browser so
# the citation contract has one implementation, not one per client.
svastha-retrieval = { path = "../retrieval", version = "0.13.0" } # x-release-please-version
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content-hash checks on att-/doc-/cur- blob ids, and hex identity codes.
hex = "0.4"
sha2 = "0.10"
# att-/doc- blob bodies carry their bytes base64-encoded in JSON.
base64 = "0.22"
# Fallible plumbing (config, IO, relay round-trips) and typed config errors.
anyhow = "1"
thiserror = "2"
# Blocking, signed relay HTTP client (blobs, mailbox, grants) and the long-lived
# SSE poke stream read incrementally — the same crate the devtool already uses.
ureq = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Render the printed identity code as a QR: unicode for the logs, SVG for the
# localhost bootstrap page. No raster/image dependency pulled in.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# OsRng for the node's disposable identity seed (mirrors core's envelope RNG).
rand_core = { version = "0.6", features = ["getrandom"] }
# Construct the owner's X25519 public key (proposal seal target) from the bytes
# their key_handoff declared. Same major as core's, so one version in the tree.
x25519-dalek = "2"
ocrs = "0.12.2"
rten = "0.24.0"
image = "0.25.10"

[dev-dependencies]
# The browser's entry point into the shared ranker, so the context-line parity
# test can drive the *actual* web path rather than a hand-copy of it. Native
# only: `wasm-pack build crates/wasm` never resolves dev-dependencies, so this
# edge exists for `cargo test` alone and cannot reach the browser bundle.
svastha-wasm = { path = "../wasm" }
# Stand the real relay up in-process (its own tokio runtime on an ephemeral
# port) so the node's client logic is exercised against the actual wire API —
# the same pattern the devtool's integration test uses.
svastha-relay = { path = "../relay" }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
axum = "0.8"
tempfile = "3"
