name: release

on:
  push:
    branches: [main]
  # Manual PWA redeploy from current main, for when deploy-pwa failed on a
  # release and a rerun would only replay the broken snapshot.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Opens/updates a release PR from the conventional-commit history; merging it
  # tags the release, cuts the GitHub release, and sets release_created=true.
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: rp
        with:
          # A PR opened with GITHUB_TOKEN gets no CI run until someone approves
          # it by hand, and the release PR has required checks. This token opens
          # it as a user instead. Without the secret it falls back to
          # GITHUB_TOKEN and the old behaviour.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please stamps the new version into the workspace Cargo.tomls
      # (via extra-files) but can't touch Cargo.lock, so the release PR opens
      # with a stale lockfile until someone pushes a manual refresh — this bit
      # the v0.1.0 release PR (CI failed on the version mismatch). The refresh
      # is done here, in this job, right after the action runs, so the release
      # PR never sits with a stale lockfile between two workflows.
      - name: Check out the release PR branch
        if: steps.rp.outputs.prs_created == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ fromJson(steps.rp.outputs.pr).headBranchName }}
          # Same token as release-please, so the lockfile push below re-runs CI
          # on the commit the release PR will actually merge.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Install Rust
        if: steps.rp.outputs.prs_created == 'true'
        run: rustup toolchain install stable --profile minimal

      # Re-resolves only the workspace-member versions release-please just
      # bumped; third-party dependency versions are left alone.
      - name: Refresh Cargo.lock
        if: steps.rp.outputs.prs_created == 'true'
        run: cargo update --workspace

      # This can't loop: the push goes to the release branch, and this workflow
      # runs only on main. A re-run finds a clean lockfile and skips the commit.
      - name: Commit and push the refreshed lockfile
        if: steps.rp.outputs.prs_created == 'true'
        run: |
          if [ -n "$(git status --porcelain Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: refresh Cargo.lock for release"
            git push origin HEAD:${{ fromJson(steps.rp.outputs.pr).headBranchName }}
          fi

  # Runs only when a release was actually cut (same workflow run, so it isn't
  # blocked by the GITHUB_TOKEN "don't trigger workflows" rule). Publishes the
  # six crates to crates.io and the wasm SDK to npm as @svastha/core.
  # Also dispatchable: versions come from the Cargo.tomls on main (not the
  # release output), and the already-uploaded skip makes re-runs safe.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # npm publishes via trusted publishing (OIDC): the workflow identity is the
    # credential, so no npm token exists to leak. id-token lets the runner mint
    # the OIDC token; job-level permissions override the workflow block, so
    # contents: read must be restated.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # Dependency order: core first, then retrieval (core only) before the wasm
      # and node crates that consume it. Modern cargo waits for each crate to
      # appear in the index before returning.
      # Already-uploaded versions are skipped, so a run that dies mid-loop
      # (crates.io rate limits new crates in bursts) can be re-dispatched and
      # picks up where it left off instead of failing on the first crate.
      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in svastha-core svastha-import svastha-retrieval svastha svastha-wasm svastha-relay svastha-node; do
            echo "publishing $crate"
            if ! output=$(cargo publish -p "$crate" 2>&1); then
              if grep -qE "already (uploaded|exists)" <<<"$output"; then
                echo "$crate: this version is already on crates.io — skipping"
              else
                echo "$output"
                exit 1
              fi
            fi
          done

      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.13.1

      - name: Build the npm SDK (@svastha/core)
        run: |
          wasm-pack build crates/wasm --target bundler --scope svastha
          version=$(jq -r '."."' .release-please-manifest.json)
          jq --arg v "$version" '.name = "@svastha/core" | .version = $v' \
            crates/wasm/pkg/package.json > crates/wasm/pkg/package.json.tmp
          mv crates/wasm/pkg/package.json.tmp crates/wasm/pkg/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm may lag.
      - name: Update npm
        run: npm install -g npm@latest

      # No token: npm detects the Actions OIDC context and authenticates as the
      # trusted publisher configured in the package's npmjs.com settings.
      # Provenance attestations are generated automatically.
      - name: Publish to npm
        run: cd crates/wasm/pkg && npm publish --access public

  # Builds and pushes the relay image. Downstream deploy config watches GHCR
  # for new tags; it doesn't live in this repo.
  image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Runner and deploy target are both amd64, so a single-platform build is enough.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cosmicspork/svastha-relay:${{ needs.release-please.outputs.version }}
            ghcr.io/cosmicspork/svastha-relay:latest
          # Each image keeps its own cache. Sharing the default scope meant each
          # build overwrote the other's cache index.
          cache-from: type=gha,scope=svastha-relay
          cache-to: type=gha,mode=max,scope=svastha-relay

  # Builds and pushes the node image. Separate from the relay image (different
  # binary, different trust posture) but same pattern; downstream deploy
  # config for either watches GHCR the same way.
  image-node:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Runner and deploy target are both amd64, so a single-platform build is enough.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.node
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cosmicspork/svastha-node:${{ needs.release-please.outputs.version }}
            ghcr.io/cosmicspork/svastha-node:latest
          # Each image keeps its own cache. Sharing the default scope meant each
          # build overwrote the other's cache index.
          cache-from: type=gha,scope=svastha-node
          cache-to: type=gha,mode=max,scope=svastha-node

  # Builds and deploys the PWA. Cut from the same release as the relay image,
  # so the trust-contract version embedded in each always matches the other.
  deploy-pwa:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.13.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Build the PWA
        run: |
          cd web
          bun install --frozen-lockfile
          bun run build

      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          workingDirectory: web
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
