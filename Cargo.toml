[workspace]
resolver = "2"
members = ["crates/core", "crates/svastha", "crates/wasm", "crates/relay", "crates/node", "crates/import", "crates/retrieval", "crates/devtool"]
# The Tauri shell is its own workspace; see src-tauri/Cargo.toml.
exclude = ["src-tauri"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/cosmicspork/svastha"
